<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вивчаємо слова</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2b3a;--mut:#6b6b80;--pri:#6c5ce7;--ok:#27ae60;--bd:#f0e0c0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2b;--card:#2a2840;--ink:#f3f0ff;--mut:#b5b0d0;--bd:#3d3a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b2b;--card:#2a2840;--ink:#f3f0ff;--mut:#b5b0d0;--bd:#3d3a5c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 16px}h2{font-size:20px;margin:24px 0 10px}h3{margin:18px 0 8px}
.box{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;color:inherit;background:transparent;border:2px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
#w{flex:1;font-size:20px}
.b{font:inherit;font-weight:700;border:0;border-radius:14px;padding:11px 16px;cursor:pointer;background:var(--bd);color:var(--ink)}
.b.pri{background:var(--pri);color:#fff}.b.ok{background:var(--ok);color:#fff;margin-top:12px}.b:disabled{opacity:.5;cursor:default}
.sm{color:var(--mut);font-size:14px}
.prev{display:flex;gap:14px;align-items:center;margin-top:12px}
.pic{font-size:64px;line-height:1;width:96px;height:96px;display:grid;place-items:center;border-radius:24px;background:#ffe9a8;flex:none}
.pic.big{width:100%;height:190px;font-size:120px;color:#2b2b3a}
.en{font-size:26px;font-weight:800}.en.big{font-size:38px;text-align:center;margin:10px 0}
.snd{border:0;background:var(--bd);color:var(--ink);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;vertical-align:middle;margin-left:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--bd);border-radius:999px;padding:4px 4px 4px 14px;font-size:18px;cursor:pointer;user-select:none}
.chip.on{border-color:var(--pri);background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{border-radius:20px;padding:12px;text-align:center;cursor:pointer;color:#2b2b3a;border:2px solid rgba(0,0,0,.06)}
.card .pic{width:100%;background:rgba(255,255,255,.55);font-size:56px;height:84px;margin-bottom:6px}
.card b{display:block;font-size:20px}.card small{color:#4a4a5e}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);z-index:5}
.ov[hidden]{display:none}
.sheet{position:relative;max-width:560px;margin:16px auto;background:var(--card);border-radius:24px;padding:16px}
.x{position:absolute;right:12px;top:12px;z-index:2;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;background:#fff;color:#222}
.ukl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:22px;font-weight:700}
.uk{background:var(--bd);border-radius:999px;padding:4px 4px 4px 14px}
#slots,#tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.slot,.tile{width:54px;height:62px;border-radius:14px;font:800 30px system-ui,sans-serif;text-transform:uppercase;cursor:pointer;border:3px dashed var(--bd);background:transparent;color:var(--ink)}
.slot.f{border-style:solid;border-color:var(--pri)}.slot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tile{border:0;background:#ffb84d;color:#2b2b3a;box-shadow:0 4px 0 #d98e12}.tile:active{transform:translateY(3px);box-shadow:none}
#msg{text-align:center;font-size:22px;font-weight:800;min-height:34px}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head>
<body>
<main>
<h1>📚 Вивчаємо слова</h1>
<section class="box">
 <div class="row"><input id="w" list="dl" placeholder="Слово: apple або яблуко" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="go" class="b pri">Перекласти</button></div>
 <div id="res"></div><datalist id="dl"></datalist>
</section>
<div class="row" style="justify-content:space-between;margin:24px 0 10px"><h2 style="margin:0">Мої слова <span id="cnt" class="sm"></span></h2><button class="b pri" id="prac">🎲 Тренування</button></div>
<div id="grid" class="grid"></div>
</main>
<div id="ov" class="ov" hidden></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=["#ffd6e0","#d4f1c5","#cfe8ff","#ffe9a8","#e3d4ff","#ffd9b8"];
let words=[];try{words=JSON.parse(localStorage.getItem("kw")||"[]")}catch(e){}
const persist=()=>{try{localStorage.setItem("kw",JSON.stringify(words))}catch(e){}};
let cur=null,L=null;

function say(t,l){try{const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.8;
 const vs=speechSynthesis.getVoices();const v=vs.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(l.toLowerCase()))||vs.find(v=>v.lang.toLowerCase().startsWith(l.slice(0,2)));
 if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const pic=w=>w.img?`<img src="${w.img}" alt="">`:w.emoji?esc(w.emoji):`<b>${esc(w.en[0].toUpperCase())}</b>`;
const sb=(t,l)=>`<button class="snd" data-say="${esc(t)}" data-l="${l}" aria-label="Озвучити">🔊</button>`;

async function trAI(){
 const q=$("w").value.trim();if(!q)return;
 $("go").disabled=true;$("res").innerHTML='<p class="sm">Шукаю переклад…</p>';
 try{
  const s=await claude.use("sample");
  if(!s){$("res").innerHTML='<p>Переклад тут недоступний. Відкрий сторінку в claude.ai.</p>';return}
  let r=await s.json('Translate the English word or short phrase "'+q.replace(/"/g,"")+'" into Ukrainian. Reply with ONLY JSON, no markdown: {"en":"the English word, spelling corrected, lowercase","uk":["up to 5 distinct common Ukrainian translations, most common first, short"],"emoji":"1-2 emoji that best picture this word for a small child"}');
  if(typeof r==="string")r=JSON.parse(r.replace(/```json|```/g,"").trim());
  const opts=[...new Set((r.uk||[]).map(String))].slice(0,6);
  if(!opts.length)throw 0;
  cur={en:String(r.en||q).toLowerCase(),opts,sel:new Set([0]),emoji:r.emoji||"🖼️"};
  renderRes();
 }catch(e){$("res").innerHTML='<p>Не вдалося перекласти. Спробуй ще раз.</p>'}
 finally{$("go").disabled=false}
}
function renderRes(){
 $("res").innerHTML=`<div class="prev"><div class="pic" id="pic">${pic(cur)}</div><div><div class="en">${esc(cur.en)} ${sb(cur.en,"en-US")}</div><label class="sm">Картинка (емодзі): <input id="emo" value="${esc(cur.emoji)}" maxlength="8" size="4"></label><br><button class="b" id="photo" style="margin-top:6px">📷 Своє фото</button><input type="file" id="file" accept="image/*" hidden></div></div>
 <p class="sm">${cur.manual?"Цього слова немає у словнику. Впиши переклад сам:":"Обери потрібні переклади:"}</p>
 <div class="chips">${cur.opts.map((o,i)=>`<span class="chip ${cur.sel.has(i)?"on":""}" data-i="${i}">${esc(o)}${sb(o,"uk-UA")}</span>`).join("")}</div>
 <div class="row" style="margin-top:10px"><input id="own" placeholder="Свій переклад" size="14"><button class="b" id="addown">+</button></div><button id="save" class="b ok" ${cur.sel.size?"":"disabled"}>➕ Додати до моїх слів</button>`;
}
function renderGrid(){
 $("cnt").textContent=words.length?"("+words.length+")":"";
 $("grid").innerHTML=words.length?words.map((w,i)=>`<div class="card" data-open="${i}" style="background:${COL[i%6]}"><div class="pic">${pic(w)}</div><b>${esc(w.en)}</b><small>${esc(w.uk.join(", "))}</small></div>`).join(""):'<p class="sm">Поки що порожньо. Додай перше слово зверху.</p>';
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(i){
 const ch=[...words[i].en.replace(/\s+/g,"")];
 let t=ch.map((c,k)=>({id:k,c}));
 for(let n=0;n<8&&ch.length>1;n++){shuffle(t);if(t.map(x=>x.c).join("")!==ch.join(""))break}
 L={i,ch,tiles:t,slots:ch.map(()=>null),done:false,del:false};
}
function renderLearn(){
 const w=words[L.i];$("ov").hidden=false;
 $("ov").innerHTML=`<div class="sheet"><button class="x" data-act="close" aria-label="Закрити">✕</button>
 <div class="pic big" style="background:${COL[L.i%6]}">${pic(w)}</div>
 <div class="en big">${esc(w.en)} ${sb(w.en,"en-US")}</div>
 <div class="ukl">${w.uk.map(u=>`<span class="uk">${esc(u)}${sb(u,"uk-UA")}</span>`).join("")}</div>
 <h3 style="text-align:center">Збери слово з літер</h3>
 <div id="slots"></div><div id="tiles"></div><div id="msg"></div>
 <div class="row" style="justify-content:center"><button class="b" data-act="shuf">🔀 Перемішати</button><button class="b pri" data-act="next">Далі ➡️</button><button class="b" data-act="edit">✏️ Редагувати</button><button class="b" data-act="del">🗑️</button></div></div>`;
 renderGame();
}
function renderGame(msg,bad){
 const tl=id=>L.tiles.find(t=>t.id===id).c;
 $("slots").innerHTML=L.ch.map((_,j)=>{const id=L.slots[j];return `<button class="slot ${id!==null?"f":""} ${L.done?"ok":""}" data-slot="${j}">${id!==null?esc(tl(id)):""}</button>`}).join("");
 $("tiles").innerHTML=L.tiles.filter(t=>!L.slots.includes(t.id)).map(t=>`<button class="tile" data-tile="${t.id}">${esc(t.c)}</button>`).join("");
 const m=$("msg");m.textContent=msg||"";m.className=bad?"shake":"";
}

document.addEventListener("click",e=>{
 const t=e.target;
 const s=t.closest("[data-say]");if(s){say(s.dataset.say,s.dataset.l);return}
 const chip=t.closest(".chip");
 if(chip){const i=+chip.dataset.i;cur.sel.has(i)?cur.sel.delete(i):cur.sel.add(i);renderRes();return}
 if(t.id==="photo"){$("file").click();return}
 if(t.id==="addown"){const v=$("own").value.trim();if(v){cur.opts.push(v);cur.sel.add(cur.opts.length-1);renderRes()}return}
 if(t.id==="save"){
  const e2={en:cur.en,uk:[...cur.sel].sort().map(i=>cur.opts[i]),emoji:cur.emoji,img:cur.img};
  words=words.filter(w=>w.en!==e2.en);words.unshift(e2);persist();renderGrid();
  cur=null;$("res").innerHTML='<p class="sm">✅ Додано!</p>';$("w").value="";return}
 const card=t.closest("[data-open]");if(card){startGame(+card.dataset.open);renderLearn();return}
 const tile=t.closest("[data-tile]");
 if(tile&&L&&!L.done){
  const j=L.slots.indexOf(null);if(j<0)return;
  L.slots[j]=+tile.dataset.tile;
  if(L.slots.includes(null)){renderGame();return}
  const g=L.slots.map(id=>L.tiles.find(x=>x.id===id).c).join("");
  if(g===L.ch.join("")){L.done=true;renderGame("🎉 Молодець!");say(words[L.i].en,"en-US")}
  else renderGame("Спробуй ще 🙂",true);
  return}
 const slot=t.closest("[data-slot]");
 if(slot&&L&&!L.done){L.slots[+slot.dataset.slot]=null;renderGame();return}
 const a=t.closest("[data-act]");if(!a)return;
 if(a.dataset.act==="close"){$("ov").hidden=true;L=null}
 else if(a.dataset.act==="shuf"){startGame(L.i);renderGame()}
 else if(a.dataset.act==="next"){startGame(words.length>1?(L.i+1+Math.floor(Math.random()*(words.length-1)))%words.length:0);renderLearn()}
 else if(a.dataset.act==="edit"){const w=words[L.i];cur={en:w.en,opts:w.uk.slice(),sel:new Set(w.uk.map((_,i)=>i)),emoji:w.emoji,img:w.img};$("w").value=w.en;$("ov").hidden=true;L=null;renderRes();window.scrollTo(0,0)}
 else if(a.dataset.act==="del"){
  if(!L.del){L.del=true;a.textContent="Точно видалити?";return}
  words.splice(L.i,1);persist();renderGrid();$("ov").hidden=true;L=null}
});
document.addEventListener("input",e=>{if(e.target.id==="emo"&&cur){cur.emoji=e.target.value||"🖼️";cur.img=null;$("pic").innerHTML=pic(cur)}});
const DICT=`dog|собака,пес|🐶;cat|кіт,кішка|🐱;mouse|миша|🐭;rabbit|кролик,заєць|🐰;fox|лисиця,лис|🦊;bear|ведмідь|🐻;panda|панда|🐼;tiger|тигр|🐯;lion|лев|🦁;cow|корова|🐮;pig|свиня|🐷;frog|жаба|🐸;monkey|мавпа|🐵;chicken|курка|🐔;penguin|пінгвін|🐧;bird|птах,пташка|🐦;duck|качка|🦆;owl|сова|🦉;wolf|вовк|🐺;horse|кінь|🐴;unicorn|єдиноріг|🦄;bee|бджола|🐝;butterfly|метелик|🦋;snail|равлик|🐌;ant|мураха|🐜;spider|павук|🕷️;fish|риба|🐟;dolphin|дельфін|🐬;whale|кит|🐳;shark|акула|🦈;octopus|восьминіг|🐙;turtle|черепаха|🐢;snake|змія|🐍;crocodile|крокодил|🐊;elephant|слон|🐘;giraffe|жирафа|🦒;zebra|зебра|🦓;camel|верблюд|🐫;kangaroo|кенгуру|🦘;sheep|вівця|🐑;goat|коза|🐐;deer|олень|🦌;squirrel|білка|🐿️;hedgehog|їжак|🦔;bat|кажан|🦇;dinosaur|динозавр|🦖;crab|краб|🦀
apple|яблуко|🍎;banana|банан|🍌;orange|апельсин,помаранча|🍊;lemon|лимон|🍋;pear|груша|🍐;peach|персик|🍑;cherry|вишня,черешня|🍒;strawberry|полуниця,суниця|🍓;grapes|виноград|🍇;watermelon|кавун|🍉;pineapple|ананас|🍍;tomato|помідор|🍅;potato|картопля|🥔;carrot|морква|🥕;corn|кукурудза|🌽;cucumber|огірок|🥒;onion|цибуля|🧅;broccoli|броколі|🥦;mushroom|гриб|🍄;bread|хліб|🍞;cheese|сир|🧀;egg|яйце|🥚;milk|молоко|🥛;butter|масло|🧈;meat|м’ясо|🥩;sausage|ковбаса,сосиска|🌭;pizza|піца|🍕;burger|бургер|🍔;fries|картопля фрі|🍟;soup|суп|🍲;rice|рис|🍚;cake|торт|🎂;cookie|печиво|🍪;chocolate|шоколад|🍫;candy|цукерка|🍬;ice cream|морозиво|🍦;honey|мед|🍯;juice|сік|🧃;water|вода|💧;tea|чай|🍵;coffee|кава|☕;salt|сіль|🧂;sandwich|бутерброд|🥪;donut|пончик|🍩;popcorn|попкорн|🍿

car|машина,автомобіль|🚗;bus|автобус|🚌;train|потяг|🚆;plane|літак|✈️;ship|корабель|🚢;boat|човен|⛵;bicycle|велосипед|🚲;motorcycle|мотоцикл|🏍️;truck|вантажівка|🚚;tractor|трактор|🚜;rocket|ракета|🚀;helicopter|вертоліт|🚁;taxi|таксі|🚕;ambulance|швидка допомога|🚑;fire truck|пожежна машина|🚒

const D=new Map(),R=new Map();
DICT.split(/[;\n]/).filter(Boolean).forEach(l=>{const[e,u,m]=l.split("|");const o={en:e,uk:u.split(","),emoji:m};D.set(e,o);o.uk.forEach(x=>{const k=x.toLowerCase();if(!R.has(k))R.set(k,o)})});
$("dl").innerHTML=[...D.keys()].map(k=>`<option value="${k}">`).join("");
function tr(){
 const q=$("w").value.trim().toLowerCase();if(!q)return;
 const o=D.get(q)||R.get(q);
 cur=o?{en:o.en,opts:o.uk.slice(),sel:new Set([0]),emoji:o.emoji||""}:{en:q,opts:[],sel:new Set(),emoji:"🖼️",manual:true};
 const sv=words.find(w=>w.en===cur.en);
 if(sv){cur.sel=new Set();sv.uk.forEach(u=>{let i=cur.opts.indexOf(u);if(i<0){cur.opts.push(u);i=cur.opts.length-1}cur.sel.add(i)});cur.emoji=sv.emoji;cur.img=sv.img;cur.manual=false}
 renderRes();
}
$("prac").addEventListener("click",()=>{if(!words.length)return;startGame(Math.floor(Math.random()*words.length));renderLearn()});
$("res").addEventListener("change",e=>{
 const f=e.target.id==="file"&&e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);cur.img=c.toDataURL("image/jpeg",.75);renderRes()};im.src=r.result};r.readAsDataURL(f)});
$("go").addEventListener("click",tr);
$("w").addEventListener("keydown",e=>{if(e.key==="Enter")tr()});
try{speechSynthesis.getVoices()}catch(e){}
renderGrid();
